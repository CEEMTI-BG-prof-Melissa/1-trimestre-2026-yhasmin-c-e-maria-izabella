<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title> Formulário HTML</title>
        <meta charset ="UTF-8">
    </head>
    <body>
        <h1>Cadastro de usuário.</h1>
        <form action="cadastro.php" method="GET">
            <label for="nome"> Nome: </label>
            <input type="text" id="nome" name="nome">
            <br>
            <label for="email">E-mail: </label> 
            <input type="email" id="email" name="email">
            <br>
            <label for="senha">Senha: </label>
            <input type="password" id="senha" name="senha">
            <br>
            <label for="idade">Idade: </label>
            <input type="number" id="idade" name="idade">
            <br>
            <label for="data"> Data de nascimento:</label>
            <input type="date" id="data" name="data">
            <br>
            <p> Turno: </p>
            <input type="radio" name="manha" id="manha"> <label for="manha">Manhã </label>
            <input type="radio" name="tarde" id="tarde"> <label for="tarde">Tarde </label>
            <input type="radio" name="noite" id="noite"> <label for="noite">Noite </label>
            <br>
            <p>Áreas de interesse: </p>
            <input type="checkbox" name="programacao" id="programacao"> <label for="programacao">Programação</label>
            <input type="checkbox" name="design" id="design"> <label for="design">Design</label>
            <br><br>
            <input type="submit"  value="Enviar">
            <input type="reset" value="Limpar">
            </form>
    </body>
</html>
